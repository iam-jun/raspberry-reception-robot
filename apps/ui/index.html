<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Reception</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="reception-stage" aria-live="polite">
        <div class="assistant-scene" aria-hidden="true">
          <div class="pulse-ring ring-one"></div>
          <div class="pulse-ring ring-two"></div>
          <div class="assistant-avatar">
            <div class="avatar-face">
              <span class="avatar-eye"></span>
              <span class="avatar-eye"></span>
              <span class="avatar-mouth"></span>
            </div>
          </div>
          <div class="voice-meter">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="welcome-panel">
          <div class="topbar">
            <div>
              <p class="eyebrow">Reception desk</p>
              <h1>Smart Reception</h1>
            </div>
            <button id="refreshStatusButton" class="icon-button" type="button" aria-label="Refresh status" title="Refresh status">↻</button>
          </div>
          <p id="statusText" class="status-line">Checking system status...</p>
          <p id="assistantState" class="assistant-state">Ready to help.</p>

          <div class="controls">
            <button id="voiceButton" class="voice-button primary" type="button">
              <span class="button-icon" aria-hidden="true">●</span>
              <span class="button-text">Talk</span>
            </button>
            <button id="askButton" class="primary ask-inline-button" type="button">Send</button>
          </div>

          <div class="ask-panel">
            <label for="questionInput">Question</label>
            <textarea id="questionInput" rows="3" placeholder="Ask for directions, visitor information, or type Vietnamese here..."></textarea>
          </div>
        </div>
      </section>

      <section class="conversation-panel">
        <div class="chat-card visitor-card">
          <span class="chat-label">Visitor</span>
          <p id="questionText">Tap Talk or type a question.</p>
        </div>
        <div class="chat-card live-card">
          <span class="chat-label">Live transcript</span>
          <p id="transcriptionText">Waiting...</p>
        </div>
        <div class="chat-card assistant-card">
          <span class="chat-label">Reception</span>
          <p id="answerText">Hello, I can help with information from the reception documents.</p>
          <audio id="answerAudio" controls hidden></audio>
        </div>
      </section>

      <section class="operations-layout">
        <article class="ops-panel">
          <div class="panel-heading">
            <h2>System</h2>
            <button id="ingestButton" class="secondary small-button" type="button">Ingest Documents</button>
          </div>
          <section class="status-grid" id="statusGrid" aria-live="polite"></section>
        </article>

        <article class="ops-panel">
          <h2>Context</h2>
          <div id="sourcesList" class="sources-list">No sources yet.</div>
        </article>

        <article class="ops-panel">
          <h2>Visitor</h2>
          <div id="emotionText" class="emotion">unknown</div>
          <p id="emotionDetail">No camera sample yet.</p>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/app.js" defer></script>
  </body>
</html>
